<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily_ST_M Backtester</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar / Configuration -->
        <aside class="sidebar glass-panel">
            <div class="sidebar-header">
                <h2>Daily_ST_M</h2>
                <span class="badge">PRO</span>
            </div>
            
            <form id="config-form">
                <div class="form-section">
                    <h3>Timeframe & Universe</h3>
                    <div class="input-group">
                        <label for="start_date">Start Date</label>
                        <input type="date" id="start_date" name="start_date" value="2021-01-01" required>
                    </div>
                    <div class="input-group">
                        <label for="end_date">End Date</label>
                        <input type="date" id="end_date" name="end_date" value="2025-12-31" required>
                    </div>
                    <div class="input-group">
                        <label for="universe_size">Universe Size (Top N)</label>
                        <input type="number" id="universe_size" name="universe_size" value="484" required>
                    </div>
                </div>

                <div class="form-section">
                    <h3>Capital & Allocation</h3>
                    <div class="input-group">
                        <label for="initial_capital">Initial Capital (₹)</label>
                        <input type="number" id="initial_capital" name="initial_capital" value="100000" step="10000" required>
                    </div>
                    <div class="input-group">
                        <label for="allocation_per_trade">Allocation / Trade (₹)</label>
                        <input type="number" id="allocation_per_trade" name="allocation_per_trade" value="20000" step="1000" required>
                    </div>
                    <div class="input-group">
                        <label for="leverage">Leverage</label>
                        <input type="number" id="leverage" name="leverage" value="1.0" step="0.1" required>
                    </div>
                </div>

                <div class="form-section">
                    <h3>Execution Parameters</h3>
                    <div class="input-group">
                        <label for="gap_target_pct">Gap Target (%)</label>
                        <input type="number" id="gap_target_pct" name="gap_target_pct" value="1.0" step="0.1" required>
                    </div>
                    <div class="input-group">
                        <label for="fee_pct">Fees (%)</label>
                        <input type="number" id="fee_pct" name="fee_pct" value="0.0" step="0.01" required>
                    </div>
                    <div class="input-group">
                        <label for="slippage_pct">Slippage (%)</label>
                        <input type="number" id="slippage_pct" name="slippage_pct" value="0.0" step="0.01" required>
                    </div>
                </div>

                <button type="submit" id="run-btn" class="btn-primary">
                    <span class="btn-text">Run Backtest</span>
                    <span class="spinner hidden"></span>
                </button>
            </form>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <header class="top-nav glass-panel">
                <div class="stats-overview">
                    <div class="stat-card">
                        <span class="stat-label">Return</span>
                        <span class="stat-value highlight" id="stat-return">--%</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-label">Max Drawdown</span>
                        <span class="stat-value error" id="stat-dd">--%</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-label">Total Trades</span>
                        <span class="stat-value" id="stat-trades">--</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-label">Execution Time</span>
                        <span class="stat-value" id="stat-time">--s</span>
                    </div>
                </div>
            </header>

            <div class="results-container">
                <div id="welcome-state" class="empty-state glass-panel">
                    <div class="empty-icon">📊</div>
                    <h3>Ready to backtest</h3>
                    <p>Adjust parameters on the left and click "Run Backtest" to begin.</p>
                </div>

                <div id="results-view" class="results-grid hidden">
                    <div class="chart-section glass-panel">
                        <h3>Equity Curve</h3>
                        <div class="chart-container">
                            <img id="equity-chart" src="" alt="Equity Curve">
                        </div>
                    </div>
                    
                    <div class="summary-section glass-panel">
                        <h3>Summary Report</h3>
                        <pre id="summary-text" class="summary-pre"></pre>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
